# The Maven wrapper, so `./mvnw` is the only build command and no Maven has to be installed.
#
# distributionType=only-script: mvnw is a plain shell script that downloads the distribution
# below into ~/.m2/wrapper on first use. The alternative ships a maven-wrapper.jar in the
# repository, and a binary has no place in an example that exists to be read.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
