# The port, the interface and the context path are not here: they come from the environment and
# are set in Application.main, before the container is built. See .env.example.

# Spring Boot serves classpath:/public/ by itself, and that is exactly where scripts/sync-shared.sh
# puts the client scripts. Left on, the framework would serve them a second way, outside the
# allowlist in Routes and with its own caching headers. The allowlist is the only way in.
spring.web.resources.add-mappings=false

# Java 21 virtual threads: a request spends its time waiting on the gateway, and this example is
# small enough that the whole of what that changes is this line.
spring.threads.virtual.enabled=true

spring.main.banner-mode=off
logging.pattern.console=%d{yyyy/MM/dd HH:mm:ss} %msg%n
