# One location per example, so several of them share a single server block.
# Include from your server { } — the prefix must match BASE_PATH.

# This is the one example without a `location = {prefix}` redirect to the trailing-slash form,
# because Next normalises the other way. The eight plain-JS examples serve pages whose asset URLs
# are relative, so `{prefix}/` is the form that has to be reached; Next emits absolute URLs with
# the basePath already in them and, with `trailingSlash` at its default of false, answers
# `{prefix}/` with a 308 to `{prefix}`. A redirect to the slash form here would bounce against
# that one forever.
#
# So the prefix is matched without the trailing slash, which covers the bare form and everything
# under it, and Next is left to normalise.
location /hosted-fields-examples-nextjs {
    # No trailing slash and no path: the prefix must reach the app, it routes on it
    proxy_pass http://127.0.0.1:3002;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The app sends the payer's address to the platform for fraud screening
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
