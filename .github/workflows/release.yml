name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Rust cross-compiles no more easily than it has to, so each target is built on the runner that
  # is native to it and the archives are handed to the build job below. Like the Go artefacts,
  # these are self-contained: views/ and public/ are compiled in with include_dir!.
  rust:
    name: rust-axum-js (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux_amd64, archive: tar }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux_arm64, archive: tar }
          - { os: macos-latest, target: aarch64-apple-darwin, name: darwin_arm64, archive: tar }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows_amd64, archive: zip }
    defaults:
      run:
        shell: bash
        working-directory: rust-axum-js
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-axum-js
          key: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      # The archive carries no version so that a README can link to
      # releases/latest/download/<name> and never go stale; the directory inside it does, so an
      # unpacked copy still says which release it came from. deploy/ ships only with linux: a
      # systemd unit and an nginx snippet mean nothing on a laptop, where these builds are for
      # trying the example.
      - name: package
        run: |
          tag="${GITHUB_REF_NAME}"
          name="hosted-fields-examples-rust_${{ matrix.name }}"
          dir="hosted-fields-examples-rust_${tag}_${{ matrix.name }}"
          bin="hosted-fields-example-rust"
          if [ "${{ matrix.archive }}" = zip ]; then bin="$bin.exe"; fi

          mkdir -p "../dist-release/$dir"
          cp "target/${{ matrix.target }}/release/$bin" .env.example README.md "../dist-release/$dir/"
          case "${{ matrix.name }}" in linux_*) cp -r deploy "../dist-release/$dir/" ;; esac

          # zip for Windows, tar.gz everywhere else — whatever the target unpacks without extra
          # tools. 7z rather than zip: the Windows runners have no zip.
          cd ../dist-release
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip -bso0 "$name.zip" "$dir"
          else
            tar -czf "$name.tar.gz" "$dir"
          fi
          rm -rf "${dir:?}"

      - uses: actions/upload-artifact@v7
        with:
          name: rust-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error

  build:
    name: build artefacts
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nodejs-express-js/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-springboot-js/pom.xml

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # views/ and public/ are compiled in with go:embed, so a release is one binary per platform
      # and nothing else has to travel with it. deploy/ ships only with linux: a systemd unit and
      # an nginx snippet mean nothing on a laptop, where these builds are for trying the example.
      - name: go-js
        working-directory: go-js
        env:
          CGO_ENABLED: '0'
        run: |
          tag="${GITHUB_REF_NAME}"
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            # The archive carries no version so that a README can link to
            # releases/latest/download/<name> and never go stale; the directory inside it does,
            # so an unpacked copy still says which release it came from.
            name="hosted-fields-examples-go_${os}_${arch}"
            dir="hosted-fields-examples-go_${tag}_${os}_${arch}"
            bin="hosted-fields-examples-go"
            if [ "$os" = windows ]; then bin="$bin.exe"; fi

            mkdir -p "../dist-release/$dir"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "../dist-release/$dir/$bin" .
            if [ "$os" = linux ]; then cp -r deploy "../dist-release/$dir/"; fi

            # zip for Windows, tar.gz everywhere else — whatever the target unpacks without extra tools
            if [ "$os" = windows ]; then
              (cd ../dist-release && zip -qr "$name.zip" "$dir")
            else
              tar -czf "../dist-release/$name.tar.gz" -C ../dist-release "$dir"
            fi
            rm -rf "../dist-release/${dir:?}"
          done

      # The node bundle carries express inside it, so the artefact needs no node_modules
      # on the target host — just Node 20.
      - name: nodejs-express-js
        working-directory: nodejs-express-js
        run: |
          tag="${GITHUB_REF_NAME}"
          name="hosted-fields-examples-nodejs-express-js"
          dir="${name}_${tag}"
          npm ci
          npm run build
          mkdir -p "../dist-release/$dir"
          cp -r dist/. "../dist-release/$dir/"
          cp -r deploy "../dist-release/$dir/"
          tar -czf "../dist-release/$name.tar.gz" -C ../dist-release "$dir"
          rm -rf "../dist-release/${dir:?}"

      # Nothing to build and nothing to install: the artefact is the sources, the shared
      # frontend and deploy/. It needs PHP 8.4 with curl and openssl on the target, and the URL
      # prefix is a setting rather than something compiled in.
      - name: php-js
        working-directory: php-js
        run: |
          tag="${GITHUB_REF_NAME}"
          name="hosted-fields-examples-php"
          dir="${name}_${tag}"
          mkdir -p "../dist-release/$dir"
          cp index.php router.php settings.php oauth.php control.php paynet.php \
             .env.example README.md "../dist-release/$dir/"
          cp -r public views deploy "../dist-release/$dir/"
          tar -czf "../dist-release/$name.tar.gz" -C ../dist-release "$dir"
          rm -rf "../dist-release/${dir:?}"

      # Nothing to build, but this is the one artefact that is not self-contained: Python has
      # no single-file story, so the target needs `pip install -r requirements.txt` in a venv.
      - name: python-flask-js
        working-directory: python-flask-js
        run: |
          tag="${GITHUB_REF_NAME}"
          name="hosted-fields-examples-python"
          dir="${name}_${tag}"
          mkdir -p "../dist-release/$dir"
          cp app.py settings.py oauth.py control.py paynet.py requirements.txt \
             .env.example README.md "../dist-release/$dir/"
          cp -r tests public views deploy "../dist-release/$dir/"
          tar -czf "../dist-release/$name.tar.gz" -C ../dist-release "$dir"
          rm -rf "../dist-release/${dir:?}"

      # Like the Python one, this artefact is not self-contained: the target runs
      # `bundle install` against the committed Gemfile.lock, which pins every version.
      - name: ruby-sinatra-js
        working-directory: ruby-sinatra-js
        run: |
          tag="${GITHUB_REF_NAME}"
          name="hosted-fields-examples-ruby"
          dir="${name}_${tag}"
          mkdir -p "../dist-release/$dir"
          cp app.rb config.ru settings.rb oauth.rb control.rb paynet.rb Gemfile Gemfile.lock \
             .env.example README.md "../dist-release/$dir/"
          cp -r test public views deploy "../dist-release/$dir/"
          tar -czf "../dist-release/$name.tar.gz" -C ../dist-release "$dir"
          rm -rf "../dist-release/${dir:?}"

      # The pages and the client scripts are packaged into the jar, so like the Go artefact this
      # one is self-contained — a single file plus deploy/, and a JRE on the target.
      - name: java-springboot-js
        working-directory: java-springboot-js
        run: |
          tag="${GITHUB_REF_NAME}"
          name="hosted-fields-examples-java"
          dir="${name}_${tag}"
          ./mvnw -B -DskipTests package
          mkdir -p "../dist-release/$dir"
          cp target/hosted-fields-example-java.jar .env.example README.md "../dist-release/$dir/"
          cp -r deploy "../dist-release/$dir/"
          tar -czf "../dist-release/$name.tar.gz" -C ../dist-release "$dir"
          rm -rf "../dist-release/${dir:?}"

      # The pages and the client scripts are embedded resources, so like the jar above this
      # artefact is self-contained. The publish is framework-dependent and carries no apphost, so
      # the one archive runs on every platform a .NET 10 runtime does.
      - name: dotnet-aspnetcore-js
        working-directory: dotnet-aspnetcore-js
        run: |
          tag="${GITHUB_REF_NAME}"
          name="hosted-fields-examples-dotnet"
          dir="${name}_${tag}"
          dotnet publish HostedFields.csproj -c Release -o "../dist-release/$dir"
          cp .env.example README.md "../dist-release/$dir/"
          cp -r deploy "../dist-release/$dir/"
          tar -czf "../dist-release/$name.tar.gz" -C ../dist-release "$dir"
          rm -rf "../dist-release/${dir:?}"

      # `output: 'standalone'` gives one server.js plus a minimal node_modules, so this
      # artefact needs nothing but Node 20 either. BASE_PATH is baked in at build time, so the
      # release carries the default prefix — rebuild from source to mount it elsewhere.
      - name: nextjs
        working-directory: nextjs
        run: |
          tag="${GITHUB_REF_NAME}"
          name="hosted-fields-examples-nextjs"
          dir="${name}_${tag}"
          yarn install --frozen-lockfile
          yarn build
          mkdir -p "../dist-release/$dir/.next"
          cp -r .next/standalone/. "../dist-release/$dir/"
          cp -r .next/static "../dist-release/$dir/.next/static"
          cp -r public "../dist-release/$dir/public"
          cp -r deploy "../dist-release/$dir/"
          tar -czf "../dist-release/$name.tar.gz" -C ../dist-release "$dir"
          rm -rf "../dist-release/${dir:?}"

      # The Rust archives were built on their own runners; they join the others here, before the
      # checksums are taken over the lot.
      - uses: actions/download-artifact@v8
        with:
          path: dist-release
          pattern: rust-*
          merge-multiple: true

      - name: checksums
        working-directory: dist-release
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-release/*.tar.gz
            dist-release/*.zip
            dist-release/SHA256SUMS
          generate_release_notes: true
          body: |
            Example integrations of Hosted Fields: the same payment, one server per language.

            - `hosted-fields-examples-go_*_linux_*.tar.gz` — one static binary with the pages
              embedded, plus `deploy/`. Needs no runtime.
            - `hosted-fields-examples-go_*_darwin_arm64.tar.gz`,
              `hosted-fields-examples-go_*_windows_amd64.zip` — the same binary for trying the
              example on a laptop. No `deploy/`: the systemd unit and the nginx snippet are for
              a Linux server.
            - `hosted-fields-examples-nodejs-express-js_*.tar.gz` — bundled `server.js` with
              `public/`, `views/` and `deploy/`. Needs Node 20+, no `node_modules`.
            - `hosted-fields-examples-php.tar.gz` — the sources with `public/`, `views/` and
              `deploy/`. Needs PHP 8.4 with curl and openssl, no Composer: `php -S` for a look,
              PHP-FPM behind nginx for anything else.
            - `hosted-fields-examples-python.tar.gz` — the sources with `tests/`, `public/`,
              `views/` and `deploy/`. Needs Python 3.12+ and, unlike the others, a
              `pip install -r requirements.txt` into a venv on the target; then gunicorn.
            - `hosted-fields-examples-ruby.tar.gz` — the sources with `test/`, `public/`,
              `views/` and `deploy/`. Needs Ruby 3.1+ and a `bundle install` on the target, then
              puma. Note that macOS's system Ruby 2.6 will not run it.
            - `hosted-fields-examples-java.tar.gz` — one jar with the pages inside it, plus
              `deploy/`. Needs a JRE 21+ and nothing else: `java -jar
              hosted-fields-example-java.jar`.
            - `hosted-fields-examples-rust_linux_*.tar.gz` — one binary with the pages compiled
              in, plus `deploy/`. Needs a glibc-based Linux and nothing else.
            - `hosted-fields-examples-rust_darwin_arm64.tar.gz`,
              `hosted-fields-examples-rust_windows_amd64.zip` — the same binary for trying the
              example on a laptop. No `deploy/`: the systemd unit and the nginx snippet are for
              a Linux server.
            - `hosted-fields-examples-dotnet.tar.gz` — one assembly with the pages inside it,
              plus `deploy/`. Needs the .NET 10 runtime and nothing else, on any platform it
              runs on: `dotnet hosted-fields-example-dotnet.dll`.
            - `hosted-fields-examples-nextjs.tar.gz` — the standalone Next.js server with
              `public/`, `.next/` and `deploy/`. Needs Node 20+, `node server.js`. The URL
              prefix is compiled in: rebuild from source to change it.

            Settings and the RSA key are supplied through the environment, see the README.
