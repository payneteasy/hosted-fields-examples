name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go-js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          # No dependencies, so there is no go.sum to key a cache on
          cache: false

      # gofmt exits 0 whatever it finds, so the output is what decides
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      # The OAuth base string and the 3DS callback checksum: the two pieces that fail silently
      - run: go test ./...
      # The runner's own platform and no other. Every commit and every pull request builds linux
      # x86-64 here; the four platforms a release carries are cross-built in release.yml, which
      # runs on a tag. Compiling them on every push would cost minutes to catch nothing: the code
      # is the same, and a target-specific break shows up on the release build.
      - run: go build ./...

  node:
    name: nodejs-express-js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodejs-express-js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nodejs-express-js/package-lock.json

      - run: npm ci
      - run: node --check src/*.js public/*.js
      # The OAuth base string and the 3DS callback checksum, on the same vectors as the Go job
      - run: npm test
      - run: npm run build

  php:
    name: php-js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php-js
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, openssl, json
          coverage: none
          tools: none

      # There is no build step and no dependencies to install, so `php -l` over every file is
      # the whole static check — the counterpart of gofmt and `node --check`.
      - name: php -l
        run: php -l *.php tests/*.php

      # The OAuth base string and the 3DS callback checksum, on the same vectors as the Go and
      # Node jobs. No credentials: the settings are validated per request, not at import.
      - run: php tests/run.php

  python:
    name: python-flask-js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-flask-js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-flask-js/requirements.txt

      - run: pip install -r requirements.txt
      # There is no build step, so compiling every module is the whole static check — the
      # counterpart of gofmt, `node --check` and `php -l`
      - run: python -m compileall -q .

      # The OAuth base string and the 3DS callback checksum, on the same vectors as the other
      # jobs. No credentials: the tests stub the environment settings.py validates at import.
      - run: python -m unittest discover -s tests -t .

  ruby:
    name: ruby-sinatra-js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby-sinatra-js
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: ruby-sinatra-js

      # There is no build step, so checking every file parses is the whole static check — the
      # counterpart of gofmt, `node --check`, `php -l` and compileall
      - name: ruby -c
        run: ruby -c app.rb config.ru settings.rb oauth.rb control.rb paynet.rb test/*.rb

      # The OAuth base string and the 3DS callback checksum, on the same vectors as the other
      # jobs. No bundle exec: minitest is a bundled gem the bundle does not name, and these tests
      # touch no gem at all. No credentials either — they stub what settings.rb validates.
      - run: ruby test/all.rb

  java:
    name: java-springboot-js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-springboot-js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-springboot-js/pom.xml

      # Java has no gofmt and no `ruby -c` in the box, so the static check is the build's: Error
      # Prone and NullAway are the counterpart of `go vet`, and spotless:check below — which
      # `verify` runs — is the counterpart of gofmt itself. `./mvnw`, so the Maven version is the
      # committed one and not whatever the runner ships.
      - run: ./mvnw -B -Perrorprone compile

      # The OAuth base string and the 3DS callback checksum, on the same vectors as the other
      # jobs, and then the jar. No credentials: the settings are validated in main(), not at class
      # initialisation, so nothing here needs any.
      - run: ./mvnw -B verify

  rust:
    name: rust-axum-js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-axum-js
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-axum-js

      # cargo fmt is the counterpart of gofmt, and clippy of `go vet` — both are in the toolchain,
      # so unlike the Java job this needs no plugin to get them
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      # The OAuth base string and the 3DS callback checksum, on the same vectors as the other
      # jobs. No credentials: the settings are parsed in main(), which no test calls.
      - run: cargo test
      # The host target only, for the same reason as the Go job above: release.yml builds the
      # other three, on a tag, each on the runner native to it
      - run: cargo build --release

  dotnet:
    name: dotnet-aspnetcore-js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet-aspnetcore-js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          # The app references no package at all, so there is no lock file of its own to key a
          # cache on — the same reason the Go job above turns caching off

      # `dotnet format` is the counterpart of gofmt and cargo fmt. There is no solution file, so
      # each project is named — which is also what keeps `dotnet run` working in the app directory.
      - run: dotnet format HostedFields.csproj --verify-no-changes
      - run: dotnet format tests/HostedFields.Tests.csproj --verify-no-changes

      # TreatWarningsAsErrors with the SDK's analysers is the counterpart of `go vet` and clippy
      - run: dotnet build HostedFields.csproj -c Release

      # The OAuth base string and the 3DS callback checksum, on the same vectors as the other
      # jobs. No credentials: the settings are loaded in Main, which no test calls.
      - run: dotnet test tests/HostedFields.Tests.csproj -c Release

      # One framework-dependent artefact, platform-neutral like the Java jar: release.yml packages
      # this very command's output
      - run: dotnet publish HostedFields.csproj -c Release

  nextjs:
    name: nextjs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: nextjs/yarn.lock

      - run: yarn install --frozen-lockfile
      # biome check + tsc --noEmit + steiger
      - run: yarn lint
      # No credentials here on purpose: the settings are validated on the first request, not
      # at import, so a build must not need them.
      - run: yarn build

  shared:
    # The premise of this repository is that the browser half does not depend on the server.
    # shared/ is the source of truth and scripts/sync-shared.sh copies it into every app; the
    # copies are committed so each directory still runs on its own. Running the script here and
    # failing on a diff is what keeps "I forgot to sync" from reaching main — and it needs no
    # per-file list, so a new app costs one line in the script and nothing here.
    name: shared frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: every copy matches shared/
        run: |
          ./scripts/sync-shared.sh
          git diff --exit-code
