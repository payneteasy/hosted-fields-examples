# One location per example, so several of them share a single server block.
# Include from your server { } — the prefix must match BASE_PATH.

location = /hosted-fields-examples-python {
    # Relative Location, so the redirect survives a non-default port or another proxy in front
    absolute_redirect off;
    return 301 /hosted-fields-examples-python/;
}

# Optional: serve the client assets straight from disk and keep gunicorn out of that path.
# Named one by one on purpose: config.js and result-config.js are generated per request and
# must reach the app, so a blanket \.js$ rule here would break every payment.
location ~ ^/hosted-fields-examples-python/(styles\.css|status\.js|checkout\.js|result\.js)$ {
    alias /opt/hosted-fields-examples-python/public/$1;
    access_log off;
    expires 1h;
}

location /hosted-fields-examples-python/ {
    # No trailing slash and no path: the prefix must reach the app, it routes on it
    proxy_pass http://127.0.0.1:3004;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The app sends the payer's address to the platform for fraud screening. ProxyFix in app.py
    # reads the entry this header attributes to the client, so it must be set here.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
