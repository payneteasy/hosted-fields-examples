# The one server block every example shares, for docker-compose.yml at the repository root.
#
# It deliberately contains no routing of its own. Each app's own deploy/nginx.conf — the file
# that ships in its release archive and that its README tells you to install — is mounted into
# conf.d/apps/ and included here unchanged. That is the point of this setup as much as the
# convenience is: those nine files are otherwise documentation with nothing to check them.
#
# They say `proxy_pass http://127.0.0.1:300x`, and they work here verbatim because every app
# container shares this container's network namespace. See the comment in docker-compose.yml.

server {
    listen 8080;
    server_name _;

    # The nine prefixes, byte for byte as each example ships them
    include /etc/nginx/conf.d/apps/*.conf;

    # A front door for the demo. Not part of any example: the payment pages all live under a
    # prefix, and nothing in shared/ is served from the root.
    # try_files rather than index: `index` fires an internal redirect to /index.html, and this
    # server has no location that would match it.
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
}
