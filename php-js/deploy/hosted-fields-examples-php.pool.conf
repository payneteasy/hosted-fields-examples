; /etc/php/8.4/fpm/pool.d/hosted-fields-examples-php.conf — chmod 640, owned by root:root
;
; PHP-FPM is the service, so there is no unit file here: a pool is what an app is. One pool per
; example means several can share one FPM and keep their own user, socket and settings.
;
; The settings are env[] lines rather than an EnvironmentFile, because that is the only
; environment a pool has. PRIVATE_KEY_PATH rather than PRIVATE_KEY for the same reason as
; everywhere else: a multi-line PEM does not survive a KEY=value line.

[hosted-fields-examples-php]
user = hosted-fields
group = hosted-fields

listen = /run/php/hosted-fields-examples-php.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Nothing is inherited from the host: every setting the app reads is named below.
clear_env = yes

env[BASE_PATH] = /hosted-fields-examples-php
; The origin the payer's browser reaches this app at, not the socket it listens on
env[PUBLIC_URL] = https://example.com

; Both are given to you with your credentials. API_URL is the gateway root, SDK_URL must be on
; that same host: the SDK refuses to run when it is served from the merchant origin.
; env[API_URL] = https://<gateway-host>/paynet
; env[SDK_URL] = https://<gateway-host>/sdk/hosted-fields/latest/index.js
env[API_URL] =
env[SDK_URL] =

env[ENDPOINT_ID] =
env[MERCHANT_LOGIN] =
; Shared secret the gateway signs its callbacks with, checked on /result
env[MERCHANT_CONTROL] =
env[PRIVATE_KEY_PATH] = /etc/hosted-fields-examples-php.key

env[ORDER_AMOUNT] = 1.00
env[ORDER_CURRENCY] = USD

; The app reads two directories and writes nothing, which is worth pinning down: this is the
; PHP-FPM counterpart of the ProtectSystem= lines in the Go example's systemd unit.
php_admin_value[open_basedir] = /opt/hosted-fields-examples-php/:/etc/hosted-fields-examples-php.key
; A PHP notice must never reach the payer's page — a stack trace on a payment page is a leak
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm/hosted-fields-examples-php.log
