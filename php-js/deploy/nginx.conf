# One location per example, so several of them share a single server block.
# Include from your server { } — the prefix must match BASE_PATH.

location = /hosted-fields-examples-php {
    # Relative Location, so the redirect survives a non-default port or another proxy in front
    absolute_redirect off;
    return 301 /hosted-fields-examples-php/;
}

location /hosted-fields-examples-php/ {
    # Everything under the prefix goes to the one entry script, the stylesheet and the client
    # scripts included. There is no try_files and no root: nothing is served off the filesystem
    # by path, so .env, views/ and the sources are not reachable even by name. index.php serves
    # public/ from an allowlist instead.
    fastcgi_pass unix:/run/php/hosted-fields-examples-php.sock;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/hosted-fields-examples-php/index.php;
    # index.php routes on the whole path, so REQUEST_URI has to arrive with the prefix intact —
    # which is what fastcgi_params already does. Only SCRIPT_NAME needs correcting.
    fastcgi_param SCRIPT_NAME /hosted-fields-examples-php/index.php;

    # The app sends the payer's address to the platform for fraud screening, and it takes the
    # header on trust: set it here rather than letting a caller's own value through.
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
}
