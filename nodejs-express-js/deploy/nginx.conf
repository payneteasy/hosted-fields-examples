# One location per example, so several of them share a single server block.
# Include from your server { } — the prefix must match BASE_PATH.

location = /hosted-fields-examples-nodejs-express-js {
    # Relative Location, so the redirect survives a non-default port or another proxy in front
    absolute_redirect off;
    return 301 /hosted-fields-examples-nodejs-express-js/;
}

# Optional: serve the client assets straight from disk and keep node out of that path.
# Only .css/.js match, so the API routes (/pay, /status, /result) still reach the app.
location ~ ^/hosted-fields-examples-nodejs-express-js/(.+\.(?:css|js))$ {
    alias /opt/hosted-fields-examples-nodejs-express-js/public/$1;
    access_log off;
    expires 1h;
}

location /hosted-fields-examples-nodejs-express-js/ {
    # No trailing slash and no path: the prefix must reach the app, it routes on it
    proxy_pass http://127.0.0.1:3000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The app sends the payer's address to the platform for fraud screening
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
